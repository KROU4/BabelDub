    tiers: [cpu, 8gb, 12gb, 24gb]
    auto_tiers: [8gb, 12gb, 24gb]
    languages: ["*"]
    notes: "UTMOS22 strong learner (sarulab-speech/UTMOS22, MIT) via SpeechMOS: predicted naturalness MOS for best-of and QA; compare candidates of one line only."
  - name: emotion2vec_plus_base
    repo: emotion2vec/emotion2vec_plus_base
    revision: b318240bfe67db81a8c572ecb37ce9c3759b81c9
    engine: qc
    role: emotion
    license: FunASR-Model-License-1.1
    commercial: false
    opt_in: true
    size_gb: 0.36
    vram_gb: 0.5
    tiers: [cpu, 8gb, 12gb, 24gb]
    auto_tiers: []
