    tiers: [cpu, 8gb, 12gb, 24gb]
    auto_tiers: [cpu, 8gb, 12gb, 24gb]
    languages: ["*"]
    notes: "Speaker embeddings: voice similarity of the dub to the original character, clustering of voices."
  - name: utmos22-strong
    repo: tarepan/SpeechMOS
    url: "https://github.com/tarepan/SpeechMOS/releases/download/v1.0.0/utmos22_strong_step7459_v1.pt"
    sha256: "38aa51ab79e2a4e09a1449758a4b37e9cbb2e8235a49662a732d33a9ba1e9bff"
    engine: qc
    role: mos
    license: MIT
