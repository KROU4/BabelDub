# BabelDub model catalog (docs/dev/CONTRACT.md §9). Read by babeldub.envsetup.catalog.
#
# BabelDub dubs with the voice of the ORIGINAL character: every engine here is a zero-shot voice
# cloning engine that takes the original line (ref audio + its source text) as the voice prompt.
#
# engines.<name>:
#   env            venv folder under BABELDUB_HOME/envs (null = runs in the CLI interpreter, no venv)
#   python         interpreter version for `uv venv --python`
#   torch          {version, index (CUDA wheels), cpu_index}; torch+torchaudio of that version
#   packages       installed after torch (pip requirement strings; git+ URLs need git on PATH)
#   gpu_packages   installed only on GPU tiers
#   import         modules that must import for the env to count as working
#   worker         script in babeldub/workers run as `<env python> -u <worker>`
#   languages      ISO 639-1 codes the engine can speak ("*" = any)
#   size_gb        approximate download size of the venv (torch wheels dominate)
#   models_of      run the models listed for another engine (same weights, different runtime)
#   cuda_only      never installed on the cpu tier and never run without CUDA
#   fallback       engine `synth`/`setup` use instead when a cuda_only engine cannot run
#   role           tts (default) | qc | vc
#   git            {url, commit}: source checkout in BABELDUB_HOME/engines/<name> at a pinned commit
#   requirements   requirements file of the checkout, installed without its torch/torchaudio lines
#   post_install   commands run with the env python inside the checkout after the packages
# models[]:
#   name           folder under BABELDUB_HOME/models (aliases: older folder names that are recognised)
#   repo/include   Hugging Face repo and optional file patterns (only these files are downloaded)
#   commercial     false = non-commercial weights; such models are opt_in and never installed by default
#   tiers          hardware tiers the model runs on; auto_tiers: tiers where `setup` installs it by default
#   size_gb        download size; vram_gb: approximate peak VRAM during inference

engines:
  voxcpm:
    env: voxcpm
    python: "3.12"
    torch: {version: "2.8.0", index: "https://download.pytorch.org/whl/cu128", cpu_index: "https://download.pytorch.org/whl/cpu"}
    packages: ["voxcpm @ git+https://github.com/OpenBMB/VoxCPM.git", "soundfile", "numpy"]
    import: [voxcpm, soundfile]
    worker: tts_voxcpm.py
    size_gb: 4.5
    languages: [ar, my, zh, da, nl, en, fi, fr, de, el, he, hi, id, it, ja, km, ko, lo, ms, "no", pl, pt, ru, es, sw, sv, tl, th, tr, vi]
    license: Apache-2.0
    cuda_only: true
    fallback: qwen3tts-fast
    notes: "Default on NVIDIA GPUs with 8 GB+ (tts.engine=auto): VoxCPM2, 2B, 48 kHz, 30 languages. Timbre from a long original reference (reference_wav_path) plus a target-language continuation prompt (ref_strategy=bootstrap). Peak VRAM 6.5 GB on an RTX 3060 Ti. Takes plain text: no U+0301 stress marks."
  applio:
    env: applio
    role: vc
    python: "3.12"
    torch: {version: "2.11.0", index: "https://download.pytorch.org/whl/cu128", cpu_index: "https://download.pytorch.org/whl/cpu"}
    git: {url: "https://github.com/IAHispano/Applio", commit: "5171e1dcf31a33d1afeb14ef7c6aac6dadae5dc1"}
    requirements: requirements-engine.txt
    post_install:
      - [core.py, prerequisites, --pretraineds-hifigan, --models, --no-exe]
    import: [torch, faiss, librosa]
    size_gb: 8.5
    languages: ["*"]
    license: MIT
    cuda_only: true
    notes: "RVC v2 voice conversion (stage `vc`): one model per main character trained on its clean original lines (`babeldub vc train`), applied after `post`. Works for any target language. Training needs an NVIDIA GPU (20 epochs on 30 min of speech: ~15 min on an RTX 3060 Ti)."
  qwen3tts-fast:
    env: qwen3tts-fast
    python: "3.12"
    torch: {version: "2.8.0", index: "https://download.pytorch.org/whl/cu128", cpu_index: "https://download.pytorch.org/whl/cpu"}
    # transformers 5.20.x breaks the codec ('MimiConfig' object has no attribute 'rope_theta'): keep the pin
    packages: ["faster-qwen3-tts==0.5.4", "transformers==5.15.1", "soundfile", "numpy"]
    import: [faster_qwen3_tts, soundfile]
    worker: tts_qwen3_fast.py
    size_gb: 4.0
    languages: [zh, en, ja, ko, de, fr, ru, pt, es, it]
    license: MIT
    models_of: qwen3tts
    cuda_only: true
    fallback: qwen3tts
    notes: "Default on NVIDIA GPUs: the same Qwen3-TTS models through faster-qwen3-tts (CUDA graphs). RTX 3060 Ti, 1.7B-Base: RTF ~0.52 per line vs ~3.7 (single) / ~1.2-1.4 (batch 4) for qwen-tts, peak VRAM ~4.5 GB, same output for the same seed."
  qwen3tts:
    env: qwen3tts
    python: "3.12"
    torch: {version: "2.8.0", index: "https://download.pytorch.org/whl/cu128", cpu_index: "https://download.pytorch.org/whl/cpu"}
    packages: ["qwen-tts", "soundfile", "numpy"]
    import: [qwen_tts, soundfile]
    worker: tts_qwen3.py
    size_gb: 4.0
    languages: [zh, en, ja, ko, de, fr, ru, pt, es, it]
    license: Apache-2.0
    notes: "Official qwen-tts package; the engine on the CPU and the fallback of qwen3tts-fast. In-context cloning: ref_audio + ref_text of the original line carry timbre and emotion."
  chatterbox:
    env: chatterbox
    python: "3.12"
    torch: {version: "2.6.0", index: "https://download.pytorch.org/whl/cu124", cpu_index: "https://download.pytorch.org/whl/cpu"}
    # PyPI chatterbox-tts 0.1.7 cannot load Multilingual V3 (no t3_model argument): install from GitHub.
    packages: ["chatterbox-tts @ git+https://github.com/resemble-ai/chatterbox.git", "soundfile"]
    import: [chatterbox.mtl_tts, soundfile]
    worker: tts_chatterbox.py
    size_gb: 3.5
    languages: [ar, da, de, el, en, es, fi, fr, he, hi, it, ja, ko, ms, nl, "no", pl, pt, ru, sv, sw, tr, zh]
    license: MIT
    notes: "Multilingual V3 (pl, tr and 21 more). Every output file carries an inaudible PerTh watermark."
  qc:
    env: qc
    python: "3.12"
    torch: {version: "2.8.0", index: "https://download.pytorch.org/whl/cu128", cpu_index: "https://download.pytorch.org/whl/cpu"}
    packages: ["faster-whisper", "speechbrain", "soundfile", "numpy", "jiwer", "num2words"]
    gpu_packages: ["nvidia-cublas-cu12", "nvidia-cudnn-cu12==9.*"]
    import: [faster_whisper, speechbrain, soundfile]
    worker: qc_worker.py
    size_gb: 5.0
    languages: ["*"]
    license: MIT
    notes: "Quality control: ASR (CER against the dub text) and speaker similarity to the original voice."
  dummy:
    env: null
    worker: tts_dummy.py
    import: []
    languages: ["*"]
    license: MIT
    notes: "Test engine without a venv or model: writes a tone of the expected length. For pipeline tests only."

models:
  - name: VoxCPM2
    repo: openbmb/VoxCPM2
    engine: voxcpm
    role: tts
    license: Apache-2.0
    commercial: true
    size_gb: 4.7
    vram_gb: 6.5
    tiers: [8gb, 12gb, 24gb]
    auto_tiers: [8gb, 12gb, 24gb]
    languages: [ar, my, zh, da, nl, en, fi, fr, de, el, he, hi, id, it, ja, km, ko, lo, ms, "no", pl, pt, ru, es, sw, sv, tl, th, tr, vi]
    notes: "Default dubbing model on 8 GB+ GPUs. Low-Budget Repairs (en->ru, with RVC): CER 0.045, ECAPA to the originals ~0.65-0.70; won the blind listening rounds."
  - name: Qwen3-TTS-12Hz-1.7B-Base
    repo: Qwen/Qwen3-TTS-12Hz-1.7B-Base
    engine: qwen3tts
    role: tts
    license: Apache-2.0
    commercial: true
    size_gb: 4.54
    vram_gb: 6
    tiers: [8gb, 12gb, 24gb]
    auto_tiers: [8gb, 12gb, 24gb]
    languages: [zh, en, ja, ko, de, fr, ru, pt, es, it]
    notes: "Default voice-cloning model (3 s reference is enough)."
  - name: Qwen3-TTS-12Hz-0.6B-Base
    repo: Qwen/Qwen3-TTS-12Hz-0.6B-Base
    engine: qwen3tts
    role: tts
    license: Apache-2.0
    commercial: true
    size_gb: 2.52
    vram_gb: 4
    tiers: [cpu, 8gb, 12gb, 24gb]
    auto_tiers: [cpu]
    languages: [zh, en, ja, ko, de, fr, ru, pt, es, it]
    notes: "Smaller fallback (CPU tier, or when 1.7B runs out of VRAM)."
  - name: qwen3-tts-12hz-1.7b-ru-stress-cf
    repo: siriusfreak/qwen3-tts-12hz-1.7b-ru-stress-cf
    engine: qwen3tts
    role: tts
    license: Apache-2.0
    commercial: true
    size_gb: 4.58
    vram_gb: 6
    tiers: [8gb, 12gb, 24gb]
    # not installed or used by default: on the Low-Budget Repairs test lines it kept the original
    # actor's voice much worse than 1.7B-Base (ECAPA 0.05-0.37 vs 0.37-0.51), and BabelDub dubs in
    # the original hero's voice; opt in with `babeldub models fetch` + `babeldub set tts.model=...`
    auto_tiers: []
    languages: [ru]
    aliases: [Qwen3-TTS-1.7B-ru-stress-cf, Qwen3-TTS-1.7B-ru-stress]
    warning: "Weights are Apache-2.0, but part of the stress-training texts comes from a dataset without a declared license (see the model card); check before commercial use."
    notes: "Russian fine-tune of 1.7B-Base that follows the U+0301 stress mark; keeps the original voice worse than 1.7B-Base, so it is used only when set explicitly in tts.model."
  - name: faster-whisper-large-v3-turbo
    repo: dropbox-dash/faster-whisper-large-v3-turbo
    engine: qc
    role: asr
    license: MIT
    commercial: true
    size_gb: 1.62
    vram_gb: 2
    tiers: [cpu, 8gb, 12gb, 24gb]
    auto_tiers: [cpu, 8gb, 12gb, 24gb]
    languages: ["*"]
    notes: "ASR for QA: CER of the dub against its text."
  - name: spkrec-ecapa-voxceleb
    repo: speechbrain/spkrec-ecapa-voxceleb
    engine: qc
    role: sv
    license: Apache-2.0
    commercial: true
    size_gb: 0.09
    vram_gb: 0.5
    tiers: [cpu, 8gb, 12gb, 24gb]
    auto_tiers: [cpu, 8gb, 12gb, 24gb]
    languages: ["*"]
    notes: "Speaker embeddings: voice similarity of the dub to the original character, clustering of voices."
  - name: chatterbox-multilingual
    repo: ResembleAI/chatterbox
    include: [ve.pt, t3_mtl23ls_v3.safetensors, s3gen.pt, grapheme_mtl_merged_expanded_v1.json, conds.pt, Cangjie5_TC.json]
    engine: chatterbox
    role: tts
    license: MIT
    commercial: true
    size_gb: 3.21
    vram_gb: 7
    tiers: [8gb, 12gb, 24gb]
    auto_tiers: [8gb, 12gb, 24gb]
    languages: [ar, da, de, el, en, es, fi, fr, he, hi, it, ja, ko, ms, nl, "no", pl, pt, ru, sv, sw, tr, zh]
    warning: "Every generated file carries an inaudible PerTh watermark (Resemble AI)."
    notes: "Multilingual V3 (t3_mtl23ls_v3). With a reference in another language use cfg_weight=0."

# Non-commercial models (e.g. OmniVoice, CC-BY-NC) are not part of v0.1. When one is added it must carry
# `commercial: false` and `opt_in: true`: setup then installs it only with `--accept-license <name>`.
