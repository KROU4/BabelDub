    warning: "Weights are under the FunASR Model License v1.1 (non-standard: 'reference and learning purposes', revocable, revisable); the emotion op also needs `uv pip install funasr` in the qc env."
    notes: "Speech emotion embedding (768-dim) and label for analyze/QA; without it analyze uses prosody (F0, RMS, syllable rate) only."
