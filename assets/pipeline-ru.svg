    <text x="1170.0" y="256" font-size="16" font-weight="700" fill="#9B7BFF" text-anchor="middle">8</text>
    <text x="1170.0" y="312" font-size="19" font-weight="700" fill="#F3F0FF" text-anchor="middle">Сборка</text>
    <text x="1170.0" y="339" font-size="14" fill="#B7AEDF" text-anchor="middle">родные форматы,</text>
    <text x="1170.0" y="359" font-size="14" fill="#B7AEDF" text-anchor="middle">бэкап и откат</text>
    <text x="1170.0" y="390" font-size="13" font-family="Cascadia Mono, Consolas, Menlo, monospace" fill="#7D74A8" text-anchor="middle">build</text>
