    <text x="1018.6" y="312" font-size="19" font-weight="700" fill="#F3F0FF" text-anchor="middle">Контроль</text>
    <text x="1018.6" y="339" font-size="14" fill="#B7AEDF" text-anchor="middle">слова, голос,</text>
    <text x="1018.6" y="359" font-size="14" fill="#B7AEDF" text-anchor="middle">подача; брак — заново</text>
    <text x="1018.6" y="390" font-size="13" font-family="Cascadia Mono, Consolas, Menlo, monospace" fill="#7D74A8" text-anchor="middle">qa</text>
