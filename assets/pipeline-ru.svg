    <text x="392.0" y="471" font-size="15" font-weight="600" fill="#FFC24B" text-anchor="middle">на какой язык</text>
    <rect x="475.6" y="450" width="134.8" height="30" rx="15" fill="#9B7BFF" fill-opacity="0.12" stroke="#9B7BFF" stroke-opacity="0.55"/>
    <text x="543.0" y="471" font-size="15" font-weight="600" fill="#9B7BFF" text-anchor="middle">каких героев</text>
    <text x="1188" y="471" font-size="15" fill="#B7AEDF" text-anchor="end">остальное агенты сделают сами</text>
