<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 560" width="1280" height="560" role="img" aria-labelledby="t">
  <title id="t">From a game folder to a dubbed game</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#15112E"/><stop offset="1" stop-color="#0B0A1C"/>
    </linearGradient>
    <radialGradient id="glowA" cx="0.12" cy="0.1" r="0.55">
      <stop offset="0" stop-color="#FFB547" stop-opacity="0.16"/><stop offset="1" stop-color="#FFB547" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="0.92" cy="0.95" r="0.6">
      <stop offset="0" stop-color="#7C5CFF" stop-opacity="0.18"/><stop offset="1" stop-color="#7C5CFF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="track" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FFC24B"/><stop offset="0.5" stop-color="#FF5C8A"/><stop offset="1" stop-color="#9B7BFF"/>
    </linearGradient>
  </defs>
  <rect width="1280" height="560" rx="28" fill="url(#bg)"/>
  <rect width="1280" height="560" rx="28" fill="url(#glowA)"/>
  <rect width="1280" height="560" rx="28" fill="url(#glowB)"/>
  <g font-family="Segoe UI, Inter, Helvetica Neue, Arial, sans-serif">
    <text x="64" y="78" font-size="14" font-weight="700" letter-spacing="3" fill="#7D74A8">HOW IT WORKS</text>
    <text x="64" y="118" font-size="32" font-weight="700" fill="#F3F0FF">From a game folder to a dubbed game</text>
    <path d="M48.4 196 V188 H625.9 V196" fill="none" stroke="#FF9666" stroke-opacity="0.45" stroke-width="1.5"/>
    <text x="337.1" y="176" font-size="14" font-weight="600" fill="#FF9666" text-anchor="middle">Understand the game</text>
    <path d="M654.1 196 V188 H777.3 V196" fill="none" stroke="#F1609B" stroke-opacity="0.45" stroke-width="1.5"/>
    <text x="715.7" y="176" font-size="14" font-weight="600" fill="#F1609B" text-anchor="middle">Translate</text>
    <path d="M805.5 196 V188 H1080.2 V196" fill="none" stroke="#C66ECD" stroke-opacity="0.45" stroke-width="1.5"/>
    <text x="942.9" y="176" font-size="14" font-weight="600" fill="#C66ECD" text-anchor="middle">Re-voice</text>
    <path d="M1108.4 196 V188 H1231.6 V196" fill="none" stroke="#9B7BFF" stroke-opacity="0.45" stroke-width="1.5"/>
    <text x="1170.0" y="176" font-size="14" font-weight="600" fill="#9B7BFF" text-anchor="middle">Ship</text>
    <line x1="110" y1="250" x2="1170" y2="250" stroke="url(#track)" stroke-width="3" stroke-linecap="round" stroke-opacity="0.9"/>
    <path d="M1010.6 228 C988.6 200 897.1 200 875.1 226" fill="none" stroke="#C36FD0" stroke-width="1.6" stroke-dasharray="4 4"/>
    <path d="M875.1 226 l1 -9 M875.1 226 l8 -4" stroke="#C36FD0" stroke-width="1.6" fill="none" stroke-linecap="round"/>
    <circle cx="110.0" cy="250" r="21" fill="#141130" stroke="#FFC24B" stroke-width="2.5"/>
    <text x="110.0" y="256" font-size="16" font-weight="700" fill="#FFC24B" text-anchor="middle">1</text>
    <text x="110.0" y="312" font-size="19" font-weight="700" fill="#F3F0FF" text-anchor="middle">Recon</text>
    <text x="110.0" y="339" font-size="14" fill="#B7AEDF" text-anchor="middle">engine, middleware,</text>
    <text x="110.0" y="359" font-size="14" fill="#B7AEDF" text-anchor="middle">voice and text files</text>
    <text x="110.0" y="390" font-size="13" font-family="Cascadia Mono, Consolas, Menlo, monospace" fill="#7D74A8" text-anchor="middle">scan</text>
    <circle cx="261.4" cy="250" r="21" fill="#141130" stroke="#FFA55D" stroke-width="2.5"/>
    <text x="261.4" y="256" font-size="16" font-weight="700" fill="#FFA55D" text-anchor="middle">2</text>
    <text x="261.4" y="312" font-size="19" font-weight="700" fill="#F3F0FF" text-anchor="middle">Extract</text>
    <text x="261.4" y="339" font-size="14" fill="#B7AEDF" text-anchor="middle">lines to WAV,</text>
    <text x="261.4" y="359" font-size="14" fill="#B7AEDF" text-anchor="middle">subtitles linked</text>
    <text x="261.4" y="390" font-size="13" font-family="Cascadia Mono, Consolas, Menlo, monospace" fill="#7D74A8" text-anchor="middle">extract</text>
    <circle cx="412.9" cy="250" r="21" fill="#141130" stroke="#FF886F" stroke-width="2.5"/>
    <text x="412.9" y="256" font-size="16" font-weight="700" fill="#FF886F" text-anchor="middle">3</text>
    <text x="412.9" y="312" font-size="19" font-weight="700" fill="#F3F0FF" text-anchor="middle">Analyze</text>
    <text x="412.9" y="339" font-size="14" fill="#B7AEDF" text-anchor="middle">pauses, pitch,</text>
    <text x="412.9" y="359" font-size="14" fill="#B7AEDF" text-anchor="middle">energy, line class</text>
    <text x="412.9" y="390" font-size="13" font-family="Cascadia Mono, Consolas, Menlo, monospace" fill="#7D74A8" text-anchor="middle">analyze</text>
    <circle cx="564.3" cy="250" r="21" fill="#141130" stroke="#FF6B81" stroke-width="2.5"/>
    <text x="564.3" y="256" font-size="16" font-weight="700" fill="#FF6B81" text-anchor="middle">4</text>
    <text x="564.3" y="312" font-size="19" font-weight="700" fill="#F3F0FF" text-anchor="middle">Cast</text>
    <text x="564.3" y="339" font-size="14" fill="#B7AEDF" text-anchor="middle">characters and</text>
    <text x="564.3" y="359" font-size="14" fill="#B7AEDF" text-anchor="middle">their voice refs</text>
    <text x="564.3" y="390" font-size="13" font-family="Cascadia Mono, Consolas, Menlo, monospace" fill="#7D74A8" text-anchor="middle">cast</text>
    <circle cx="715.7" cy="250" r="21" fill="#141130" stroke="#F1609B" stroke-width="2.5"/>
    <text x="715.7" y="256" font-size="16" font-weight="700" fill="#F1609B" text-anchor="middle">5</text>
    <text x="715.7" y="312" font-size="19" font-weight="700" fill="#F3F0FF" text-anchor="middle">Translate</text>
    <text x="715.7" y="339" font-size="14" fill="#B7AEDF" text-anchor="middle">agents translate</text>
    <text x="715.7" y="359" font-size="14" fill="#B7AEDF" text-anchor="middle">to fit the timing</text>
    <text x="715.7" y="390" font-size="13" font-family="Cascadia Mono, Consolas, Menlo, monospace" fill="#7D74A8" text-anchor="middle">translate</text>
    <circle cx="867.1" cy="250" r="21" fill="#141130" stroke="#D469BC" stroke-width="2.5"/>
    <text x="867.1" y="256" font-size="16" font-weight="700" fill="#D469BC" text-anchor="middle">6</text>
    <text x="867.1" y="312" font-size="19" font-weight="700" fill="#F3F0FF" text-anchor="middle">Voice</text>
    <text x="867.1" y="339" font-size="14" fill="#B7AEDF" text-anchor="middle">the hero’s own voice,</text>
    <text x="867.1" y="359" font-size="14" fill="#B7AEDF" text-anchor="middle">never slowed down</text>
    <text x="867.1" y="390" font-size="13" font-family="Cascadia Mono, Consolas, Menlo, monospace" fill="#7D74A8" text-anchor="middle">synth · vc</text>
    <circle cx="1018.6" cy="250" r="21" fill="#141130" stroke="#B872DE" stroke-width="2.5"/>
    <text x="1018.6" y="256" font-size="16" font-weight="700" fill="#B872DE" text-anchor="middle">7</text>
    <text x="1018.6" y="312" font-size="19" font-weight="700" fill="#F3F0FF" text-anchor="middle">QA</text>
    <text x="1018.6" y="339" font-size="14" fill="#B7AEDF" text-anchor="middle">words, voice, delivery;</text>
    <text x="1018.6" y="359" font-size="14" fill="#B7AEDF" text-anchor="middle">rejects are redone</text>
    <text x="1018.6" y="390" font-size="13" font-family="Cascadia Mono, Consolas, Menlo, monospace" fill="#7D74A8" text-anchor="middle">qa</text>
    <circle cx="1170.0" cy="250" r="21" fill="#141130" stroke="#9B7BFF" stroke-width="2.5"/>
    <text x="1170.0" y="256" font-size="16" font-weight="700" fill="#9B7BFF" text-anchor="middle">8</text>
    <text x="1170.0" y="312" font-size="19" font-weight="700" fill="#F3F0FF" text-anchor="middle">Repack</text>
    <text x="1170.0" y="339" font-size="14" fill="#B7AEDF" text-anchor="middle">native formats,</text>
    <text x="1170.0" y="359" font-size="14" fill="#B7AEDF" text-anchor="middle">backup and rollback</text>
    <text x="1170.0" y="390" font-size="13" font-family="Cascadia Mono, Consolas, Menlo, monospace" fill="#7D74A8" text-anchor="middle">build</text>
    <rect x="64" y="436" width="1152" height="58" rx="16" fill="#FFFFFF" fill-opacity="0.035" stroke="#FFFFFF" stroke-opacity="0.07"/>
    <text x="92" y="471" font-size="17" font-weight="600" fill="#F3F0FF">You answer two questions:</text>
    <rect x="329.0" y="450" width="160.0" height="30" rx="15" fill="#FFC24B" fill-opacity="0.12" stroke="#FFC24B" stroke-opacity="0.55"/>
    <text x="409.0" y="471" font-size="15" font-weight="600" fill="#FFC24B" text-anchor="middle">target language</text>
    <rect x="501.0" y="450" width="168.4" height="30" rx="15" fill="#9B7BFF" fill-opacity="0.12" stroke="#9B7BFF" stroke-opacity="0.55"/>
    <text x="585.2" y="471" font-size="15" font-weight="600" fill="#9B7BFF" text-anchor="middle">which characters</text>
    <text x="1188" y="471" font-size="15" fill="#B7AEDF" text-anchor="end">everything else is done by the agents</text>
  </g>
</svg>
