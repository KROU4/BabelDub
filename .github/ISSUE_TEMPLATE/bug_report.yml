name: Bug report
description: Something does not work as the documentation describes
title: "[bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting a bug. **Do not attach game files** (banks, archives, line audio, text tables): they must not be distributed. Command output and paths are enough.

  - type: textarea
    id: what
    attributes:
      label: What happened
      description: Describe the problem briefly and what you expected to see.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: How to reproduce
      description: The commands or the request to the agent after which the error appears.
      placeholder: |
        1. babeldub init "D:/Games/MyGame" --lang ru
        2. babeldub scan
        3. ...
    validations:
      required: true

  - type: textarea
    id: output
    attributes:
      label: Command output
      description: The JSON printed by the `babeldub` command and the exit code. You may replace paths that contain your user name with `<user>`.
      render: json
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: BabelDub version
      description: Output of `babeldub --version`
      placeholder: babeldub 0.1.0
    validations:
      required: true

  - type: dropdown
    id: host
    attributes:
      label: Agent host
      options:
        - Claude Code
        - Codex CLI / ChatGPT
        - Gemini CLI
        - Antigravity
        - Cursor
        - GitHub Copilot
        - OpenCode
        - Web chat (claude.ai, ChatGPT)
        - No agent (CLI only)
        - Other
    validations:
      required: true

  - type: dropdown
    id: stage
    attributes:
      label: Stage
      options:
        - doctor / setup (environment, models)
        - init / status
        - scan / extract / link (game analysis)
        - cast (characters, references)
        - translate / batch (translation)
        - synth / post (voice)
        - qa (quality control)
        - build / verify (build)
        - install / uninstall / reapply (install and rollback)
        - skills, agents, hooks, plugin installation
    validations:
      required: true

  - type: textarea
    id: doctor
    attributes:
      label: Environment
      description: Output of `babeldub doctor --pretty` (OS, GPU, VRAM, driver, tools found).
      render: json

  - type: input
    id: game
    attributes:
      label: Game and engine
      description: Title, store and version of the game, engine and audio middleware, if known.
      placeholder: Low-Budget Repairs (Steam, build 1.0.3), Unity + FMOD

  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: The last lines from `<project>/logs/` or stderr. No contents of game files.
      render: text

  - type: checkboxes
    id: confirm
    attributes:
      label: Confirmation
      options:
        - label: I am not attaching game files, line audio or synthesized actor voices.
          required: true
        - label: I checked that this bug is not already reported in the issues.
          required: true
