name: New game or engine support
description: BabelDub does not find the voice-over or texts, cannot rebuild a format, or the game does not work all the way through
title: "[game] "
labels: ["game-support"]
body:
  - type: markdown
    attributes:
      value: |
        Describe the game so that its format can be worked out **without sending game files**. We need names, sizes and the structure of the files and the output of `babeldub scan`, but not the banks and archives themselves. Check [docs/ENGINES.md](https://github.com/KROU4/BabelDub/blob/main/docs/ENGINES.md) first: it lists what each engine supports today.

  - type: input
    id: game
    attributes:
      label: Game
      description: Title, store, link to the store page and version (build number).
      placeholder: My Game (Steam, https://store.steampowered.com/app/..., build 1.2.0)
    validations:
      required: true

  - type: dropdown
    id: engine
    attributes:
      label: Engine
      options:
        - Unity (Mono)
        - Unity (IL2CPP)
        - Unreal Engine 4
        - Unreal Engine 5
        - Godot
        - Ren'Py
        - RPG Maker
        - GameMaker
        - Creation Engine (Bethesda)
        - Source / Source 2
        - Custom engine
        - I don't know
    validations:
      required: true

  - type: dropdown
    id: middleware
    attributes:
      label: Audio middleware
      options:
        - FMOD (.bank)
        - Wwise (.bnk, .wem, .pck)
        - Built-in engine audio
        - Loose audio files (.ogg, .wav, .mp3)
        - I don't know
    validations:
      required: true

  - type: textarea
    id: scan
    attributes:
      label: Output of `babeldub scan`
      description: The summary JSON and, optionally, `inventory/report.md` from the project folder.
      render: json

  - type: textarea
    id: files
    attributes:
      label: Game file structure
      description: |
        A list of folders and large files with sizes (no contents). For example:
        Windows: `Get-ChildItem -Recurse "D:\Games\MyGame" -Include *.bank,*.pck,*.pak,*.assets,*.bundle | Select-Object FullName,Length`
        Linux: `find ~/Games/MyGame -size +1M -printf '%s %p\n'`
      render: text
    validations:
      required: true

  - type: textarea
    id: languages
    attributes:
      label: Languages
      description: Which languages the game has voice-over and texts in; whether an official translation into your language exists.
    validations:
      required: true

  - type: input
    id: target
    attributes:
      label: Target language
      placeholder: ru

  - type: textarea
    id: notes
    attributes:
      label: What is already known
      description: Links to modding tools and wikis, existing fan translations, special cases (cutscenes in video, lip sync, anti-cheat).

  - type: checkboxes
    id: confirm
    attributes:
      label: Confirmation
      options:
        - label: I own a legal copy of the game and need the localization for personal use or a non-commercial fan translation.
          required: true
        - label: I am not attaching game files, line audio or extracted texts.
          required: true
